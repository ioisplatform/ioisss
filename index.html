<!-- बस नीचे दिए गए हिस्से को अपने स्टाइल टैब के अंत में या पुराने क्लॉक स्टाइल की जगह पेस्ट कर दें -->
<style>
/* ===== PERFECT CLOCK GEOMETRY & DESIGN ===== */
.analog-clock, .indian-analog-clock {
    position: relative;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* नंबर्स को सटीक 30 डिग्री के अंतराल पर रखने के लिए */
.clock-number {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.clock-number span {
    position: absolute;
    width: 20px;
    height: 20px;
    left: calc(50% - 10px);
    top: calc(50% - 10px);
    text-align: center;
    font-weight: 900;
    font-size: 11px;
    color: #fff7d1;
    text-shadow: 0 1px 3px #000;
    /* ट्रिगोनोमेट्री ट्रिक: नंबर को सेंटर से बाहर धकेलना */
    --radius: 38px; 
}

/* मेन क्लॉक (बड़ी वाली) के लिए रेडियस एडजस्टमेंट */
.analog-clock .clock-number span { --radius: 42px; font-size: 14px; }

/* प्रत्येक नंबर की सटीक डिग्री */
.n1 { transform: rotate(30deg) translateY(calc(-1 * var(--radius))) rotate(-30deg); }
.n2 { transform: rotate(60deg) translateY(calc(-1 * var(--radius))) rotate(-60deg); }
.n3 { transform: rotate(90deg) translateY(calc(-1 * var(--radius))) rotate(-90deg); }
.n4 { transform: rotate(120deg) translateY(calc(-1 * var(--radius))) rotate(-120deg); }
.n5 { transform: rotate(150deg) translateY(calc(-1 * var(--radius))) rotate(-150deg); }
.n6 { transform: rotate(180deg) translateY(calc(-1 * var(--radius))) rotate(-180deg); }
.n7 { transform: rotate(210deg) translateY(calc(-1 * var(--radius))) rotate(-210deg); }
.n8 { transform: rotate(240deg) translateY(calc(-1 * var(--radius))) rotate(-240deg); }
.n9 { transform: rotate(270deg) translateY(calc(-1 * var(--radius))) rotate(-270deg); }
.n10 { transform: rotate(300deg) translateY(calc(-1 * var(--radius))) rotate(-300deg); }
.n11 { transform: rotate(330deg) translateY(calc(-1 * var(--radius))) rotate(-330deg); }
.n12 { transform: rotate(0deg) translateY(calc(-1 * var(--radius))); }

/* सुइयों का डिज़ाइन - Perfect Alignment */
.hand, .indian-hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: 50% 100%; /* सुई के निचले हिस्से से घूमेगी */
    border-radius: 10px;
    z-index: 30;
}

/* सुइयों की मोटाई और कलर */
.hour-hand, .indian-hour { width: 4px; height: 25%; background: #D4AF37; }
.min-hand, .indian-min { width: 3px; height: 35%; background: #ffffff; }
.sec-hand, .indian-sec { width: 1.5px; height: 42%; background: #FF9933; box-shadow: 0 0 5px rgba(255,153,51,0.5); }

/* बीच का पिन (Center Pin) */
.analog-clock::after, .indian-analog-clock::after {
    content: '';
    position: absolute;
    width: 8px;
    height: 8px;
    background: #D4AF37;
    border: 1px solid #000;
    border-radius: 50%;
    z-index: 40;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}
</style>

<script>
// सुइयों के रोटेशन को सुधारने के लिए छोटा सा सुधार (Logic Same, CSS Transform update)
function updateClockPerfect() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    const sDeg = s * 6;
    const mDeg = m * 6 + s * 0.1;
    const hDeg = (h % 12) * 30 + m * 0.5;

    // मेन क्लॉक
    document.getElementById('sec-hand').style.transform = `translateX(-50%) rotate(${sDeg}deg)`;
    document.getElementById('min-hand').style.transform = `translateX(-50%) rotate(${mDeg}deg)`;
    document.getElementById('hour-hand').style.transform = `translateX(-50%) rotate(${hDeg}deg)`;

    // हेडर क्लॉक
    const hs = document.getElementById('header-sec-hand');
    const hm = document.getElementById('header-min-hand');
    const hh = document.getElementById('header-hour-hand');
    
    if(hs) hs.style.transform = `translateX(-50%) rotate(${sDeg}deg)`;
    if(hm) hm.style.transform = `translateX(-50%) rotate(${mDeg}deg)`;
    if(hh) hh.style.transform = `translateX(-50%) rotate(${hDeg}deg)`;
}
setInterval(updateClockPerfect, 1000);
updateClockPerfect();
</script>
